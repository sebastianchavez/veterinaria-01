<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar Contraseña · Patitas Felices</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#059669', 'primary-light': '#10b981', 'background-dark': '#0a1f15', 'background-card': '#0f2a1c' },
          fontFamily: { display: ['Fredoka'], sans: ['Inter'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="" class="bg-background-dark text-gray-200 font-sans">
  <div class="min-h-screen flex flex-col">
    <main class="flex-1 flex items-center justify-center p-6">
      <div class="w-full max-w-md">
        <a href="index.html" class="flex items-center gap-3 mb-8 justify-center">
          <svg class="h-10 w-10 text-primary" viewBox="0 0 48 48" fill="none"><path d="M14 22c-3 0-5-3-5-6s2-6 5-6 5 3 5 6-2 6-5 6zm20 0c-3 0-5-3-5-6s2-6 5-6 5 3 5 6-2 6-5 6zM9 32c-2 0-4-2-4-5s2-5 4-5 4 2 4 5-2 5-4 5zm30 0c-2 0-4-2-4-5s2-5 4-5 4 2 4 5-2 5-4 5z" stroke="currentColor" stroke-width="2.5" fill="currentColor" fill-opacity="0.15"/><ellipse cx="24" cy="30" rx="10" ry="11" stroke="currentColor" stroke-width="2.5" fill="currentColor" fill-opacity="0.15"/></svg>
          <div>
            <h2 class="text-xl font-bold text-white leading-tight" style="font-family: 'Fredoka', sans-serif;">Patitas Felices</h2>
            <p class="text-xs uppercase tracking-widest text-primary/80">Veterinaria</p>
          </div>
        </a>

        <div id="step1" class="bg-background-card border border-gray-800 rounded-2xl p-8">
          <div class="text-center mb-6">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-primary/10 border border-primary/30 flex items-center justify-center">
              <svg class="h-8 w-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
            </div>
            <h2 class="text-2xl md:text-3xl font-bold text-white mb-2" style="font-family: 'Fredoka', sans-serif;">¿Olvidaste tu contraseña?</h2>
            <p class="text-gray-400">Te enviaremos un enlace para restablecerla</p>
          </div>

          <form id="recoverForm" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-2">Email de tu cuenta</label>
              <div class="relative">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
                  <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                </span>
                <input type="email" id="email" required class="w-full bg-background-dark border border-gray-700 rounded-lg pl-12 pr-4 py-3 text-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" placeholder="tu@email.com"/>
              </div>
            </div>

            <button type="submit" class="btn-primary w-full justify-center">Enviar enlace de recuperación</button>

            <p class="text-center text-sm text-gray-400 pt-3">
              <a href="login.html" class="text-primary hover:text-primary-light transition-colors">← Volver a iniciar sesión</a>
            </p>
          </form>
        </div>

        <div id="step2" class="hidden bg-background-card border border-gray-800 rounded-2xl p-8 text-center">
          <div class="checkmark-circle mx-auto mb-6" style="width:80px;height:80px;">
            <div class="background" style="width:80px;height:80px;"></div>
            <div class="checkmark" style="height:45px;width:25px;border-color:#0a1f15;"></div>
          </div>
          <h2 class="text-2xl md:text-3xl font-bold text-white mb-2" style="font-family: 'Fredoka', sans-serif;">¡Revisa tu email!</h2>
          <p class="text-gray-300 mb-2">Te enviamos un enlace de recuperación a</p>
          <p id="sentEmail" class="text-primary font-semibold mb-6"></p>
          <p class="text-gray-400 text-sm mb-6">Si no lo encuentras, revisa tu carpeta de spam o correo no deseado.</p>
          <a href="login.html" class="btn-outline inline-flex">Volver a iniciar sesión</a>
        </div>
      </div>
    </main>
  </div>
  <script src="js/main.js"></script>
  <script>
    function pageInit() {
      document.getElementById('recoverForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const result = Auth.resetPasswordRequest(email);
        if (!result.ok) { UI.toast(result.error, 'error'); return; }
        document.getElementById('sentEmail').textContent = email;
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
      });
    }
  </script>
</body>
</html>
