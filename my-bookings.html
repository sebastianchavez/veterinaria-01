<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle de Reserva · Patitas Felices</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#059669', 'primary-light': '#10b981', 'background-dark': '#0a1f15', 'background-card': '#0f2a1c' },
          fontFamily: { display: ['Fredoka'], sans: ['Inter'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="" class="bg-background-dark text-gray-200 font-sans">
  <div id="appHeader"></div>

  <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div id="content"></div>
  </main>

  <div id="appFooter"></div>
  <script src="js/main.js"></script>
  <script>
    function pageInit() {
      if (!UI.requireAuth('my-bookings.html')) return;
      const params = new URLSearchParams(window.location.search);
      const id = params.get('reserva');
      const reserva = id ? Reservas.get(id) : null;
      const user = Auth.current();

      if (!reserva) {
        document.getElementById('content').innerHTML = `
          <div class="max-w-2xl mx-auto bg-background-card border border-gray-800 rounded-2xl p-10 text-center">
            <div class="text-5xl mb-3">😿</div>
            <p class="text-white font-semibold text-lg mb-2">Reserva no encontrada</p>
            <p class="text-gray-400 text-sm mb-5">Es posible que la reserva haya sido eliminada.</p>
            <a href="profile.html" class="btn-primary">Ir a mis reservas</a>
          </div>
        `;
        return;
      }

      if (reserva.userId !== user.id) {
        document.getElementById('content').innerHTML = `
          <div class="max-w-2xl mx-auto bg-background-card border border-gray-800 rounded-2xl p-10 text-center">
            <div class="text-5xl mb-3">🚫</div>
            <p class="text-white font-semibold text-lg mb-2">Acceso denegado</p>
            <p class="text-gray-400 text-sm mb-5">No tienes permisos para ver esta reserva.</p>
            <a href="profile.html" class="btn-primary">Mis reservas</a>
          </div>
        `;
        return;
      }

      const servicio = UI.servicioById(reserva.servicioId);
      const vet = UI.veterinarioById(reserva.profesionalId);
      const estado = UI.estadoBadge(reserva.estado);
      const pago = UI.pagoBadge(reserva.pago);
      const canCancel = Reservas.canCancel(reserva);
      const codigo = 'PF-' + reserva.id.slice(-6).toUpperCase();

      const especieLabel = reserva.mascota ? UI.especieById(reserva.mascota.especie)?.label : '';
      const mascotaNombre = reserva.mascota?.nombre || '—';
      const mascotaRaza = reserva.mascota?.raza || '';
      const mascotaEdad = reserva.mascota?.edad || '';
      const especieIcon = reserva.mascota ? UI.especieById(reserva.mascota.especie)?.icon || '🐾' : '🐾';

      const metodoPagoLabel = reserva.metodoPago === 'tarjeta' ? 'Tarjeta de crédito/débito'
        : reserva.metodoPago === 'transferencia' ? 'Transferencia bancaria'
        : reserva.metodoPago === 'efectivo' ? 'Efectivo en clínica'
        : null;

      document.getElementById('content').innerHTML = `
        <div class="max-w-4xl mx-auto">
          <a href="profile.html" class="inline-flex items-center gap-1 text-sm text-gray-400 hover:text-primary mb-4 transition-colors">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            Volver a mis reservas
          </a>

          <div class="bg-background-card border border-gray-800 rounded-2xl p-6 md:p-8">
            <div class="flex flex-wrap items-start justify-between gap-4 pb-6 mb-6 border-b border-gray-800">
              <div>
                <p class="text-xs text-gray-400 uppercase tracking-widest mb-1">Código de reserva</p>
                <p class="text-primary font-mono font-bold text-2xl">${codigo}</p>
              </div>
              <div class="text-right">
                <span class="text-xs uppercase px-4 py-2 rounded-full border font-semibold ${estado.cls}">${estado.label}</span>
                <p class="text-xs mt-2 ${pago.cls} inline-block px-3 py-1 rounded-full border">${pago.label}</p>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div class="lg:col-span-2 space-y-4">
                <div class="flex items-center gap-4 bg-background-dark border border-gray-800 rounded-xl p-4">
                  <img src="${servicio.imagen}" class="h-16 w-16 rounded-lg object-cover"/>
                  <div class="flex-1 min-w-0">
                    <p class="text-xs text-gray-400 uppercase tracking-wider">Servicio</p>
                    <p class="text-white font-semibold text-lg">${UI.escape(servicio.nombre)}</p>
                    <p class="text-gray-400 text-sm">${UI.categoriaLabel(servicio.categoria)} · ${servicio.duracion} min</p>
                  </div>
                </div>
                <div class="flex items-center gap-4 bg-background-dark border border-gray-800 rounded-xl p-4">
                  <div class="pet-avatar text-2xl">${especieIcon}</div>
                  <div class="flex-1 min-w-0">
                    <p class="text-xs text-gray-400 uppercase tracking-wider">Mascota</p>
                    <p class="text-white font-semibold text-lg">${UI.escape(mascotaNombre)}</p>
                    <p class="text-gray-400 text-sm">${UI.escape(especieLabel)} ${mascotaRaza ? '· ' + UI.escape(mascotaRaza) : ''} ${mascotaEdad ? '· ' + UI.escape(mascotaEdad) : ''}</p>
                  </div>
                </div>
                <div class="flex items-center gap-4 bg-background-dark border border-gray-800 rounded-xl p-4">
                  <img src="${vet.foto}" class="h-16 w-16 rounded-full object-cover"/>
                  <div class="flex-1 min-w-0">
                    <p class="text-xs text-gray-400 uppercase tracking-wider">Profesional</p>
                    <p class="text-white font-semibold text-lg">${UI.escape(vet.nombre)}</p>
                    <p class="text-gray-400 text-sm">${UI.escape(vet.rol)} · ${UI.escape(vet.colegiatura)}</p>
                  </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div class="bg-background-dark border border-gray-800 rounded-xl p-4">
                    <p class="text-xs text-gray-400 uppercase tracking-wider">Fecha</p>
                    <p class="text-white font-semibold mt-1">${UI.formatDate(reserva.fecha)}</p>
                  </div>
                  <div class="bg-background-dark border border-gray-800 rounded-xl p-4">
                    <p class="text-xs text-gray-400 uppercase tracking-wider">Hora</p>
                    <p class="text-white font-semibold mt-1">${reserva.hora}</p>
                  </div>
                </div>
                ${reserva.notas ? `<div class="bg-background-dark border border-gray-800 rounded-xl p-4">
                  <p class="text-xs text-gray-400 uppercase tracking-wider mb-1">Notas</p>
                  <p class="text-white text-sm">${UI.escape(reserva.notas)}</p>
                </div>` : ''}
              </div>

              <aside class="space-y-4">
                <div class="bg-background-dark border border-primary/30 rounded-xl p-5">
                  <p class="text-xs text-gray-400 uppercase tracking-wider mb-1">Total</p>
                  <p class="text-primary font-bold text-3xl" style="font-family: 'Fredoka', sans-serif;">${UI.formatPrice(reserva.precio || servicio.precio)}</p>
                  ${metodoPagoLabel ? `<p class="text-xs text-gray-400 mt-2">Pagado con ${metodoPagoLabel}</p>` : ''}
                </div>

                <div class="bg-background-dark border border-gray-800 rounded-xl p-5">
                  <p class="text-xs text-gray-400 uppercase tracking-wider mb-2">Ubicación</p>
                  <p class="text-white text-sm">Av. Providencia 1234<br/>Providencia, Santiago, Chile</p>
                  <a href="https://maps.google.com/?q=Av.+Providencia+1234+Providencia+Santiago+Chile" target="_blank" class="text-primary text-xs hover:underline mt-2 inline-block">Ver en Google Maps →</a>
                </div>

                ${canCancel ? `
                  <button id="btnCancel" class="w-full bg-red-500/10 border-2 border-red-500/40 text-red-300 font-bold py-3 rounded-xl hover:bg-red-500/20 transition-all flex items-center justify-center gap-2">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M9 7V4a2 2 0 012-2h2a2 2 0 012 2v3"></path></svg>
                    Anular cita
                  </button>
                  <p class="text-xs text-center text-gray-500">Cancelación gratuita hasta 24h antes</p>
                ` : (reserva.estado === 'anulada' ? `
                  <div class="bg-red-500/10 border border-red-500/30 rounded-xl p-4 text-center">
                    <p class="text-red-300 font-semibold">Cita anulada</p>
                  </div>
                ` : (reserva.estado === 'completada' ? `
                  <div class="bg-gray-500/10 border border-gray-500/30 rounded-xl p-4 text-center">
                    <p class="text-gray-300 font-semibold">Servicio completado</p>
                  </div>
                ` : `
                  <div class="bg-yellow-500/10 border border-yellow-500/30 rounded-xl p-4 text-center">
                    <p class="text-yellow-300 font-semibold text-sm">No se puede anular</p>
                    <p class="text-xs text-gray-400 mt-1">Menos de 24h antes de la cita</p>
                  </div>
                `))}

                ${reserva.pago === 'pendiente' && reserva.estado !== 'anulada' ? `
                  <a href="payment.html?reserva=${reserva.id}" class="btn-primary w-full justify-center text-sm">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                    Pagar reserva
                  </a>
                ` : ''}
              </aside>
            </div>
          </div>

          <div class="mt-6 grid grid-cols-1 sm:grid-cols-2 gap-3">
            <a href="contact.html" class="bg-background-card border border-gray-800 rounded-xl p-4 hover:border-primary transition-all flex items-center gap-3">
              <svg class="h-6 w-6 text-primary flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
              <div>
                <p class="text-white font-semibold">¿Dudas sobre tu cita?</p>
                <p class="text-gray-400 text-sm">Contáctanos</p>
              </div>
            </a>
            <a href="services.html" class="bg-background-card border border-gray-800 rounded-xl p-4 hover:border-primary transition-all flex items-center gap-3">
              <svg class="h-6 w-6 text-primary flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
              <div>
                <p class="text-white font-semibold">Reservar otra cita</p>
                <p class="text-gray-400 text-sm">Ver servicios</p>
              </div>
            </a>
          </div>
        </div>
      `;

      const btnCancel = document.getElementById('btnCancel');
      if (btnCancel) {
        btnCancel.addEventListener('click', () => {
          const modal = document.createElement('div');
          modal.className = 'modal-backdrop';
          modal.innerHTML = `
            <div class="modal-content">
              <div class="text-center mb-4">
                <div class="w-14 h-14 mx-auto rounded-full bg-red-500/10 border border-red-500/30 flex items-center justify-center mb-3">
                  <svg class="h-7 w-7 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                </div>
                <h3 class="text-xl font-bold text-white mb-2" style="font-family: 'Fredoka', sans-serif;">¿Anular esta cita?</h3>
                <p class="text-gray-400 text-sm">Esta acción no se puede deshacer. Si ya pagaste, te contactaremos para coordinar el reembolso.</p>
              </div>
              <div class="bg-background-dark border border-gray-800 rounded-xl p-3 mb-5 text-sm">
                <p class="text-gray-400 text-xs">Reserva <span class="text-primary font-mono">${codigo}</span></p>
                <p class="text-white font-semibold">${UI.escape(servicio.nombre)}</p>
                <p class="text-gray-400 text-xs">${UI.formatDate(reserva.fecha)} · ${reserva.hora}</p>
              </div>
              <div class="flex gap-2">
                <button id="cancelNo" class="btn-outline flex-1 justify-center">No, mantener</button>
                <button id="cancelYes" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-lg flex-1 transition-colors">Sí, anular</button>
              </div>
            </div>
          `;
          document.body.appendChild(modal);
          modal.querySelector('#cancelNo').addEventListener('click', () => modal.remove());
          modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
          modal.querySelector('#cancelYes').addEventListener('click', () => {
            Reservas.cancel(reserva.id);
            modal.remove();
            UI.toast('Cita anulada correctamente');
            setTimeout(() => window.location.reload(), 600);
          });
        });
      }
    }
  </script>
</body>
</html>
