<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pago Confirmado · Patitas Felices</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#059669', 'primary-light': '#10b981', 'background-dark': '#0a1f15', 'background-card': '#0f2a1c' },
          fontFamily: { display: ['Fredoka'], sans: ['Inter'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="" class="bg-background-dark text-gray-200 font-sans">
  <div id="appHeader"></div>

  <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="max-w-3xl mx-auto">
      <div class="text-center mb-10">
        <div class="checkmark-circle mx-auto mb-6">
          <div class="background"></div>
          <div class="checkmark"></div>
        </div>
        <p class="text-primary uppercase tracking-[0.3em] text-xs mb-3 font-medium">¡Pago exitoso!</p>
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-3" style="font-family: 'Fredoka', sans-serif;">Pago confirmado</h1>
        <p class="text-gray-400">Tu reserva está completamente confirmada</p>
      </div>

      <div id="recibo" class="bg-background-card border border-gray-800 rounded-2xl p-6 md:p-8 mb-6"></div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-10">
        <a href="my-bookings.html?reserva=" id="btnDetalle" class="btn-primary justify-center text-sm">Ver detalle</a>
        <button id="btnPrint" class="btn-outline justify-center text-sm">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
          Imprimir recibo
        </button>
        <a href="index.html" class="btn-outline justify-center text-sm">Volver al inicio</a>
      </div>

      <section class="bg-gradient-to-br from-primary/10 to-primary/5 border border-primary/30 rounded-2xl p-8 text-center">
        <h2 class="text-2xl font-bold text-white mb-3" style="font-family: 'Fredoka', sans-serif;">Te esperamos pronto 🐾</h2>
        <p class="text-gray-300 mb-6 max-w-xl mx-auto">Recibirás un recordatorio 24 horas antes de tu cita. Si necesitas cambiar la fecha o anular, puedes hacerlo desde tu perfil.</p>
        <div class="flex flex-wrap justify-center gap-3">
          <a href="profile.html" class="btn-primary">Ver mis reservas</a>
          <a href="services.html" class="btn-outline">Reservar otra cita</a>
        </div>
      </section>
    </div>
  </main>

  <div id="appFooter"></div>
  <script src="js/main.js"></script>
  <script>
    function pageInit() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('reserva');
      const reserva = id ? Reservas.get(id) : null;
      const pagoDraft = Reservas.getPagoDraft() || {};

      if (!reserva) {
        document.getElementById('recibo').innerHTML = '<p class="text-center text-gray-400 py-6">No se encontró información del pago.</p>';
        return;
      }

      const user = Auth.current();
      const servicio = UI.servicioById(reserva.servicioId);
      const vet = UI.veterinarioById(reserva.profesionalId);
      const especieIcon = reserva.mascota ? UI.especieById(reserva.mascota.especie)?.icon || '🐾' : '🐾';
      const codigo = 'PF-' + reserva.id.slice(-6).toUpperCase();
      const numOp = 'OP-' + Date.now().toString().slice(-10);

      const metodoLabel = reserva.metodoPago === 'tarjeta' ? 'Tarjeta de crédito/débito'
        : reserva.metodoPago === 'transferencia' ? 'Transferencia bancaria'
        : reserva.metodoPago === 'efectivo' ? 'Efectivo en clínica'
        : '—';

      document.getElementById('recibo').innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-4 pb-5 mb-5 border-b border-gray-800">
          <div>
            <p class="text-xs text-gray-400 uppercase tracking-widest mb-1">Recibo de pago</p>
            <p class="text-primary font-mono font-bold text-xl">${numOp}</p>
          </div>
          <div class="text-right">
            <p class="text-xs text-gray-400 uppercase tracking-widest mb-1">Reserva</p>
            <p class="text-white font-mono font-semibold">${codigo}</p>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
          <div>
            <p class="text-xs text-gray-400 uppercase tracking-wider mb-1">Cliente</p>
            <p class="text-white font-semibold">${UI.escape(user.nombre)}</p>
            <p class="text-gray-400 text-sm">${UI.escape(user.email)}</p>
            <p class="text-gray-400 text-sm">${UI.escape(user.telefono)}</p>
          </div>
          <div>
            <p class="text-xs text-gray-400 uppercase tracking-wider mb-1">Mascota</p>
            <p class="text-white font-semibold">${especieIcon} ${UI.escape(reserva.mascota?.nombre || '—')}</p>
            <p class="text-gray-400 text-sm">${UI.escape(UI.especieById(reserva.mascota?.especie)?.label || '')}</p>
          </div>
        </div>

        <div class="bg-background-dark border border-gray-800 rounded-xl p-4 mb-5">
          <div class="flex items-center gap-3 mb-3">
            <img src="${servicio.imagen}" class="h-12 w-12 rounded-lg object-cover"/>
            <div class="flex-1 min-w-0">
              <p class="text-white font-semibold">${UI.escape(servicio.nombre)}</p>
              <p class="text-gray-400 text-sm">${UI.formatDate(reserva.fecha)} · ${reserva.hora}</p>
              <p class="text-gray-500 text-xs">con ${UI.escape(vet.nombre)}</p>
            </div>
          </div>
        </div>

        <div class="space-y-2 text-sm mb-5">
          <div class="flex justify-between"><span class="text-gray-400">Subtotal:</span><span class="text-white">${UI.formatPrice(reserva.precio || servicio.precio)}</span></div>
          <div class="flex justify-between"><span class="text-gray-400">Método de pago:</span><span class="text-white">${metodoLabel}</span></div>
          ${reserva.metodoPago === 'tarjeta' ? `<div class="flex justify-between"><span class="text-gray-400">Tarjeta:</span><span class="text-white">**** **** ****4241</span></div>` : ''}
          ${reserva.metodoPago === 'transferencia' ? `<div class="flex justify-between"><span class="text-gray-400">N° operación:</span><span class="text-white">${pagoDraft.metodo === 'transferencia' ? 'Aprobada' : '—'}</span></div>` : ''}
          <div class="border-t border-gray-800 pt-3 mt-3 flex justify-between items-center">
            <span class="text-white font-semibold text-base">Total pagado:</span>
            <span class="text-primary text-3xl font-bold" style="font-family: 'Fredoka', sans-serif;">${UI.formatPrice(reserva.precio || servicio.precio)}</span>
          </div>
        </div>

        <div class="bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-3 flex items-center gap-2">
          <svg class="h-5 w-5 text-emerald-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <p class="text-sm text-emerald-200">Pago procesado correctamente. Tu cita está confirmada.</p>
        </div>
      `;

      document.getElementById('btnDetalle').href = 'my-bookings.html?reserva=' + reserva.id;
      document.getElementById('btnPrint').addEventListener('click', () => window.print());

      Reservas.clearPagoDraft();
    }
  </script>
</body>
</html>
